# ──────────────────────────────────────────────────────────────────────────────
# Swarm node label assignments — read by `./scripts/swarm-setup.sh label-nodes`
#
# Format:  <hostname-pattern>: <label1>=<value1>, <label2>=<value2>, ...
#   - hostname-pattern matches Docker node Hostname (e.g. "ip-172-31-39-11")
#   - lines starting with # are comments; blank lines are ignored
#
# Required labels per role:
#   Managers    → infra=true             (Postgres, Mongo, Redis, RabbitMQ, monitoring)
#   Primary mgr → infra=true, nginx=true (also hosts api-gateway on host-port 3000)
#   AI worker   → ml=true                (dedicated; ai-service only)
#   App workers → app.half=1 OR app.half=2 (microservices split across two halves)
#
# When recreating EC2 instances, update the hostname patterns below.
# To find current hostnames:  docker node ls
# ──────────────────────────────────────────────────────────────────────────────

# ── Managers (3 — Raft quorum) ──
ip-172-31-14-171: infra=true
ip-172-31-39-11:  infra=true, nginx=true
ip-172-31-43-201: infra=true

# ── Workers (3) ──
ip-172-31-27-208: ml=true
ip-172-31-39-167: app.half=1, role=worker
ip-172-31-40-191: app.half=2, role=worker
