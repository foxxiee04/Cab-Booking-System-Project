global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    project: cab-booking

scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # ── Node metrics (CPU, Memory, Disk) — auto-discovers exporter TASKS ──
  # Scrape the global node-exporter tasks over the overlay network. This avoids
  # depending on node advertised IPs and avoids hairpin timeouts on the manager
  # where Prometheus itself is running.
  - job_name: node-exporter
    scrape_interval: 30s
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: cab-booking_node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_task_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: cab-booking_backend
        action: keep
      # Replace task address with node-exporter container port.
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:9100'
        target_label: __address__
      # Add node hostname as 'instance' label for Grafana dashboards
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_role]
        target_label: node_role

  # ── Container metrics — auto-discovers global cAdvisor TASKS ───────────
  - job_name: cadvisor
    scrape_interval: 30s
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: cab-booking_cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_task_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: cab-booking_backend
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:8080'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_role]
        target_label: node_role

  # ── RabbitMQ queue metrics ──────────────────────────────────────────────
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: rabbitmq
          node_role: manager

  # ── API Gateway — HTTP requests, WebSocket, AI matching metrics ─────────
  - job_name: api-gateway
    metrics_path: /metrics
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: cab-booking_api-gateway
        action: keep
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_task_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: cab-booking_backend
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:3000'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_role]
        target_label: node_role
      - target_label: service
        replacement: api-gateway
